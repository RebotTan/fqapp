org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# AGP 9 ships a new DSL and built-in Kotlin; the Flutter project opts out to stay
# on the combination we have verified, and this module follows it.
android.newDsl=false
android.builtInKotlin=false

# Windows + JDK 25: in-process compilation avoids "Could not close incremental caches".
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process